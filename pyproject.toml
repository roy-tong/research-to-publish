[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-to-publish"
version = "0.2.0"
description = "A local-first research-to-website-to-social editorial pipeline"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Roy Tong"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/roy-tong/research-to-publish"
Issues = "https://github.com/roy-tong/research-to-publish/issues"

[project.optional-dependencies]
images = ["Pillow>=9.2"]

[project.scripts]
r2p = "research_to_publish.cli:main"

[tool.setuptools.packages.find]
include = ["research_to_publish*"]
